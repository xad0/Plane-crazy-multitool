name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test Go packages
        run: go test -count=1 . ./cmd/...

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web app
        working-directory: web
        run: npm test

      - name: Build web app
        working-directory: web
        run: npm run build

  build-linux:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build application
        run: ./build-linux.sh "${GITHUB_REF_NAME#v}"

      - name: Build updater
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/PC-Gear-Calculator-Updater-Linux-x64 \
            ./cmd/updater

      - name: Package Linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p package/PC-Multitool/.update

          cp dist/PC-Gear-Calculator-Linux-x64 \
            package/PC-Multitool/PC-Gear-Calculator

          cp install.sh \
            package/PC-Multitool/install.sh

          cp dist/PC-Gear-Calculator-Updater-Linux-x64 \
            package/PC-Multitool/.update/PC-Gear-Calculator-Updater

          chmod +x \
            package/PC-Multitool/PC-Gear-Calculator \
            package/PC-Multitool/install.sh \
            package/PC-Multitool/.update/PC-Gear-Calculator-Updater

          cd package
          zip -r \
            "../dist/PC-Multitool-Linux-x64-v${VERSION}.zip" \
            PC-Multitool

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/PC-Multitool-Linux-x64-v*.zip

  build-macos:
    runs-on: macos-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build application
        run: ./build-macos.sh "${GITHUB_REF_NAME#v}"

      - name: Build Intel updater
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/PC-Gear-Calculator-Updater-macOS-x64 \
            ./cmd/updater

      - name: Build ARM64 updater
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/PC-Gear-Calculator-Updater-macOS-arm64 \
            ./cmd/updater

      - name: Package macOS Intel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p package-x64/PC-Multitool/.update

          cp dist/PC-Gear-Calculator-macOS-x64 \
            package-x64/PC-Multitool/PC-Gear-Calculator

          cp dist/PC-Gear-Calculator-Updater-macOS-x64 \
            package-x64/PC-Multitool/.update/PC-Gear-Calculator-Updater

          chmod +x \
            package-x64/PC-Multitool/PC-Gear-Calculator \
            package-x64/PC-Multitool/.update/PC-Gear-Calculator-Updater

          cd package-x64
          zip -r \
            "../dist/PC-Multitool-macOS-x64-v${VERSION}.zip" \
            PC-Multitool

      - name: Package macOS ARM64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p package-arm64/PC-Multitool/.update

          cp dist/PC-Gear-Calculator-macOS-arm64 \
            package-arm64/PC-Multitool/PC-Gear-Calculator

          cp dist/PC-Gear-Calculator-Updater-macOS-arm64 \
            package-arm64/PC-Multitool/.update/PC-Gear-Calculator-Updater

          chmod +x \
            package-arm64/PC-Multitool/PC-Gear-Calculator \
            package-arm64/PC-Multitool/.update/PC-Gear-Calculator-Updater

          cd package-arm64
          zip -r \
            "../dist/PC-Multitool-macOS-arm64-v${VERSION}.zip" \
            PC-Multitool

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/PC-Multitool-macOS-x64-v*.zip
            dist/PC-Multitool-macOS-arm64-v*.zip

  build-windows:
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build application
        shell: bash
        run: ./build-windows.sh "${GITHUB_REF_NAME#v}"

      - name: Build updater
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/PC-Gear-Calculator-Updater-Windows-x64.exe \
            ./cmd/updater

      - name: Package Windows
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")

          New-Item -ItemType Directory -Force -Path "package/PC-Multitool/.update" | Out-Null

          Copy-Item `
            "dist/PC-Gear-Calculator-Windows-x64.exe" `
            "package/PC-Multitool/PC-Gear-Calculator.exe"

          Copy-Item `
            "dist/PC-Gear-Calculator-Updater-Windows-x64.exe" `
            "package/PC-Multitool/.update/PC-Gear-Calculator-Updater.exe"

          Compress-Archive `
            -Path "package/PC-Multitool" `
            -DestinationPath "dist/PC-Multitool-Windows-x64-v$version.zip" `
            -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          & $iscc `
            "/DMyAppVersion=$version" `
            "installer.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/PC-Multitool-Windows-x64-v*.zip
            dist/PC-Multitool-Setup-v*.exe

  release:
    needs:
      - test
      - build-linux
      - build-macos
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Validate release importance metadata
        shell: bash
        run: |
          tag_message="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          invalid_lines="$(printf '%s\n' "$tag_message" | grep -iE '^[[:space:]]*importance:' | grep -ivE '^[[:space:]]*importance:[[:space:]]*(normal|important|critical)[[:space:]]*$' || true)"
          if [ -n "$invalid_lines" ]; then
            echo "Invalid release importance annotation:" >&2
            printf '%s\n' "$invalid_lines" >&2
            echo "Use one line: importance: normal, importance: important, or importance: critical." >&2
            exit 1
          fi

      - name: Determine release importance
        id: importance
        shell: bash
        run: |
          importance="$(
            git for-each-ref               "refs/tags/${GITHUB_REF_NAME}"               --format='%(contents)' |
            sed -nE               's/^[[:space:]]*importance:[[:space:]]*(normal|important|critical)[[:space:]]*$/\1/ip' |
            head -n 1
          )"

          if [ -z "$importance" ]; then
            importance="normal"
          fi

          echo "value=$importance" >> "$GITHUB_OUTPUT"
          echo "Release importance: $importance"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            <!-- pc-multitool-importance: ${{ steps.importance.outputs.value }} -->
          files: |
            release-files/*
